name: API and native optimizer tests

on:
  pull_request:
    paths:
      - "services/api/**"
      - "Makefile"
      - ".github/workflows/api-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Select Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: make api-fmt-check
      - name: Build package and run native, host and HTTP parity tests
        run: make api-test
